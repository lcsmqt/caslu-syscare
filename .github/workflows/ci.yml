name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pyinstaller --noconfirm --onefile --windowed --name CasluSysCare --paths src --collect-submodules syscare src/syscare/__main__.py
      - uses: actions/upload-artifact@v4
        with: { name: CasluSysCare-windows, path: dist/CasluSysCare.exe }
